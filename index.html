<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e1e;
    font-family: Arial, Helvetica, sans-serif;
    color: #f0f0f0;
  }
  #game-container {
    text-align: center;
  }
  h1 {
    margin: 0 0 10px;
  }
  #score {
    margin-bottom: 10px;
    font-size: 20px;
  }
  canvas {
    background: #2b2b2b;
    border: 4px solid #4caf50;
    display: block;
  }
  #message {
    margin-top: 10px;
    font-size: 16px;
    min-height: 20px;
  }
</style>
</head>
<body>
  <div id="game-container">
    <h1>Snake</h1>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="message">Use arrow keys to move. Press Space to restart after Game Over.</div>
  </div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const messageEl = document.getElementById('message');

  const gridSize = 20;
  const tileCount = canvas.width / gridSize;

  const baseTickInterval = 240;
  const minTickInterval = 80;
  const speedStep = 10;
  const edgeMargin = 1;

  let tickInterval = baseTickInterval;

  let snake, prevSnake, direction, nextDirection, food, score, gameOver, lastTickTime;

  function randomFoodPosition() {
    let position;
    do {
      position = {
        x: edgeMargin + Math.floor(Math.random() * (tileCount - edgeMargin * 2)),
        y: edgeMargin + Math.floor(Math.random() * (tileCount - edgeMargin * 2))
      };
    } while (snake.some(segment => segment.x === position.x && segment.y === position.y));
    return position;
  }

  function initGame() {
    snake = [{ x: 10, y: 10 }];
    prevSnake = [{ x: 10, y: 10 }];
    direction = { x: 0, y: 0 };
    nextDirection = { x: 0, y: 0 };
    score = 0;
    gameOver = false;
    tickInterval = baseTickInterval;
    food = randomFoodPosition();
    lastTickTime = performance.now();
    scoreEl.textContent = 'Score: 0';
    messageEl.textContent = 'Use arrow keys to move. Press Space to restart after Game Over.';
  }

  function tick() {
    if (gameOver) return;

    prevSnake = snake.map(segment => ({ x: segment.x, y: segment.y }));
    lastTickTime = performance.now();
    direction = nextDirection;

    if (direction.x === 0 && direction.y === 0) {
      return;
    }

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    if (
      head.x < 0 || head.x >= tileCount ||
      head.y < 0 || head.y >= tileCount ||
      snake.some(segment => segment.x === head.x && segment.y === head.y)
    ) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = 'Score: ' + score;
      tickInterval = Math.max(minTickInterval, baseTickInterval - score * speedStep);
      food = randomFoodPosition();
    } else {
      snake.pop();
    }
  }

  function endGame() {
    gameOver = true;
    messageEl.textContent = 'Game Over! Final Score: ' + score + '. Press Space to restart.';
  }

  function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawFood() {
    const cx = food.x * gridSize + gridSize / 2;
    const cy = food.y * gridSize + gridSize / 2;
    const r = gridSize / 2 - 2;

    // apple body
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.arc(cx - r * 0.3, cy + r * 0.1, r * 0.85, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.3, cy + r * 0.1, r * 0.85, 0, Math.PI * 2);
    ctx.fill();

    // highlight
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.35, cy - r * 0.05, r * 0.25, 0, Math.PI * 2);
    ctx.fill();

    // stem
    ctx.strokeStyle = '#6d4c41';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r * 0.9);
    ctx.lineTo(cx + r * 0.15, cy - r * 1.3);
    ctx.stroke();

    // leaf
    ctx.fillStyle = '#4caf50';
    ctx.beginPath();
    ctx.ellipse(cx + r * 0.55, cy - r * 1.15, r * 0.35, r * 0.18, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake(t) {
    const dir = (direction.x === 0 && direction.y === 0) ? { x: 1, y: 0 } : direction;

    for (let i = snake.length - 1; i >= 0; i--) {
      const segment = snake[i];
      const prev = prevSnake[i] || segment;
      const drawGridX = prev.x + (segment.x - prev.x) * t;
      const drawGridY = prev.y + (segment.y - prev.y) * t;
      const isHead = i === 0;
      const x = drawGridX * gridSize + 1;
      const y = drawGridY * gridSize + 1;
      const size = gridSize - 2;

      ctx.fillStyle = isHead ? '#66bb6a' : (i % 2 === 0 ? '#4caf50' : '#43a047');
      drawRoundedRect(x, y, size, size, isHead ? 8 : 6);
      ctx.fill();

      if (isHead) {
        const cx = drawGridX * gridSize + gridSize / 2;
        const cy = drawGridY * gridSize + gridSize / 2;
        const perp = { x: -dir.y, y: dir.x };
        const forward = gridSize * 0.15;
        const side = gridSize * 0.2;

        [1, -1].forEach((sign) => {
          const ex = cx + dir.x * forward + perp.x * side * sign;
          const ey = cy + dir.y * forward + perp.y * side * sign;

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(ex, ey, gridSize * 0.13, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(ex + dir.x * gridSize * 0.05, ey + dir.y * gridSize * 0.05, gridSize * 0.06, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }
  }

  function draw(t) {
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawFood();
    drawSnake(t);
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp':
        if (direction.y === 0) nextDirection = { x: 0, y: -1 };
        e.preventDefault();
        break;
      case 'ArrowDown':
        if (direction.y === 0) nextDirection = { x: 0, y: 1 };
        e.preventDefault();
        break;
      case 'ArrowLeft':
        if (direction.x === 0) nextDirection = { x: -1, y: 0 };
        e.preventDefault();
        break;
      case 'ArrowRight':
        if (direction.x === 0) nextDirection = { x: 1, y: 0 };
        e.preventDefault();
        break;
      case ' ':
        if (gameOver) {
          initGame();
        }
        break;
    }
  });

  function renderLoop() {
    const now = performance.now();
    if (!gameOver && now - lastTickTime >= tickInterval) {
      tick();
    }
    const t = Math.min(1, Math.max(0, (performance.now() - lastTickTime) / tickInterval));
    draw(t);
    requestAnimationFrame(renderLoop);
  }

  initGame();
  requestAnimationFrame(renderLoop);
</script>
</body>
</html>
