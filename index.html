<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e1e;
    font-family: Arial, Helvetica, sans-serif;
    color: #f0f0f0;
  }
  #game-container {
    text-align: center;
  }
  h1 {
    margin: 0 0 10px;
  }
  #score {
    margin-bottom: 10px;
    font-size: 20px;
  }
  canvas {
    background: #2b2b2b;
    border: 4px solid #4caf50;
    display: block;
  }
  #message {
    margin-top: 10px;
    font-size: 16px;
    min-height: 20px;
  }
</style>
</head>
<body>
  <div id="game-container">
    <h1>Snake</h1>
    <div id="score">Score: 0</div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="message">Use arrow keys to move. Press Space to restart after Game Over.</div>
  </div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const messageEl = document.getElementById('message');

  const gridSize = 20;
  const tileCount = canvas.width / gridSize;

  const baseTickInterval = 240;
  const minTickInterval = 80;
  const speedStep = 10;
  const edgeMargin = 1;

  let tickInterval = baseTickInterval;

  const shakeDuration = 400;

  let snake, prevSnake, direction, nextDirection, food, score, gameOver, lastTickTime;
  let tongueVisible = false;
  let shaking = false;
  let shakeStartTime = 0;

  function randomFoodPosition() {
    let position;
    do {
      position = {
        x: edgeMargin + Math.floor(Math.random() * (tileCount - edgeMargin * 2)),
        y: edgeMargin + Math.floor(Math.random() * (tileCount - edgeMargin * 2))
      };
    } while (snake.some(segment => segment.x === position.x && segment.y === position.y));
    return position;
  }

  function initGame() {
    snake = [{ x: 10, y: 10 }];
    prevSnake = [{ x: 10, y: 10 }];
    direction = { x: 0, y: 0 };
    nextDirection = { x: 0, y: 0 };
    score = 0;
    gameOver = false;
    tickInterval = baseTickInterval;
    shaking = false;
    food = randomFoodPosition();
    lastTickTime = performance.now();
    scoreEl.textContent = 'Score: 0';
    messageEl.textContent = 'Use arrow keys to move. Press Space to restart after Game Over.';
  }

  function tick() {
    if (gameOver) return;

    prevSnake = snake.map(segment => ({ x: segment.x, y: segment.y }));
    lastTickTime = performance.now();
    direction = nextDirection;

    if (direction.x === 0 && direction.y === 0) {
      return;
    }

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
    const hitSelf = snake.some(segment => segment.x === head.x && segment.y === head.y);

    if (hitWall || hitSelf) {
      if (hitWall) {
        shaking = true;
        shakeStartTime = performance.now();
      }
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = 'Score: ' + score;
      tickInterval = Math.max(minTickInterval, baseTickInterval - score * speedStep);
      food = randomFoodPosition();
    } else {
      snake.pop();
    }
  }

  function endGame() {
    gameOver = true;
    messageEl.textContent = 'Game Over! Final Score: ' + score + '. Press Space to restart.';
  }

  function drawFood() {
    const cx = food.x * gridSize + gridSize / 2;
    const cy = food.y * gridSize + gridSize / 2;
    const r = gridSize / 2 - 2;

    // apple body
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.arc(cx - r * 0.3, cy + r * 0.1, r * 0.85, 0, Math.PI * 2);
    ctx.arc(cx + r * 0.3, cy + r * 0.1, r * 0.85, 0, Math.PI * 2);
    ctx.fill();

    // highlight
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.35, cy - r * 0.05, r * 0.25, 0, Math.PI * 2);
    ctx.fill();

    // stem
    ctx.strokeStyle = '#6d4c41';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r * 0.9);
    ctx.lineTo(cx + r * 0.15, cy - r * 1.3);
    ctx.stroke();

    // leaf
    ctx.fillStyle = '#4caf50';
    ctx.beginPath();
    ctx.ellipse(cx + r * 0.55, cy - r * 1.15, r * 0.35, r * 0.18, -0.6, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake(t) {
    const dir = (direction.x === 0 && direction.y === 0) ? { x: 1, y: 0 } : direction;

    const points = snake.map((segment, i) => {
      const prev = prevSnake[i] || segment;
      const gx = prev.x + (segment.x - prev.x) * t;
      const gy = prev.y + (segment.y - prev.y) * t;
      return { x: gx * gridSize + gridSize / 2, y: gy * gridSize + gridSize / 2 };
    });

    const bodyWidth = gridSize - 4;

    // continuous body tube
    if (points.length > 1) {
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.lineWidth = bodyWidth;
      ctx.strokeStyle = '#4caf50';
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();
    }

    // head shake when the snake bumps into the wall
    let shakeX = 0;
    let shakeY = 0;
    if (shaking) {
      const elapsed = performance.now() - shakeStartTime;
      if (elapsed < shakeDuration) {
        const amplitude = gridSize * 0.25 * (1 - elapsed / shakeDuration);
        shakeX = Math.sin(elapsed / 20) * amplitude;
        shakeY = Math.cos(elapsed / 15) * amplitude * 0.5;
      } else {
        shaking = false;
      }
    }

    const hx = points[0].x + shakeX;
    const hy = points[0].y + shakeY;

    ctx.fillStyle = '#66bb6a';
    ctx.beginPath();
    ctx.arc(hx, hy, bodyWidth / 2 + 1, 0, Math.PI * 2);
    ctx.fill();

    // tongue flicks out briefly every 5 seconds
    if (tongueVisible && !gameOver) {
      const perpTongue = { x: -dir.y, y: dir.x };
      const forkSpread = gridSize * 0.12;
      const base = { x: hx + dir.x * (bodyWidth / 2), y: hy + dir.y * (bodyWidth / 2) };
      const tip = { x: hx + dir.x * (bodyWidth / 2 + gridSize * 0.5), y: hy + dir.y * (bodyWidth / 2 + gridSize * 0.5) };

      ctx.strokeStyle = '#e53935';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(base.x, base.y);
      ctx.lineTo(tip.x, tip.y);
      ctx.moveTo(tip.x, tip.y);
      ctx.lineTo(tip.x + perpTongue.x * forkSpread, tip.y + perpTongue.y * forkSpread);
      ctx.moveTo(tip.x, tip.y);
      ctx.lineTo(tip.x - perpTongue.x * forkSpread, tip.y - perpTongue.y * forkSpread);
      ctx.stroke();
    }

    // eyes
    const perp = { x: -dir.y, y: dir.x };
    const forward = gridSize * 0.12;
    const side = gridSize * 0.2;

    [1, -1].forEach((sign) => {
      const ex = hx + dir.x * forward + perp.x * side * sign;
      const ey = hy + dir.y * forward + perp.y * side * sign;

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ex, ey, gridSize * 0.13, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(ex + dir.x * gridSize * 0.05, ey + dir.y * gridSize * 0.05, gridSize * 0.06, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function draw(t) {
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawFood();
    drawSnake(t);
  }

  document.addEventListener('keydown', (e) => {
    switch (e.key) {
      case 'ArrowUp':
        if (direction.y === 0) nextDirection = { x: 0, y: -1 };
        e.preventDefault();
        break;
      case 'ArrowDown':
        if (direction.y === 0) nextDirection = { x: 0, y: 1 };
        e.preventDefault();
        break;
      case 'ArrowLeft':
        if (direction.x === 0) nextDirection = { x: -1, y: 0 };
        e.preventDefault();
        break;
      case 'ArrowRight':
        if (direction.x === 0) nextDirection = { x: 1, y: 0 };
        e.preventDefault();
        break;
      case ' ':
        if (gameOver) {
          initGame();
        }
        break;
    }
  });

  function renderLoop() {
    const now = performance.now();
    if (!gameOver && now - lastTickTime >= tickInterval) {
      tick();
    }
    const t = Math.min(1, Math.max(0, (performance.now() - lastTickTime) / tickInterval));
    draw(t);
    requestAnimationFrame(renderLoop);
  }

  setInterval(() => {
    tongueVisible = true;
    setTimeout(() => { tongueVisible = false; }, 400);
  }, 5000);

  initGame();
  requestAnimationFrame(renderLoop);
</script>
</body>
</html>
